# nishantsharma.co.uk — Gloaming & Muga build
# Static site: no build step. Netlify publishes this folder as-is.
[build]
  publish = "."

# HTML: always revalidate so colour/content updates show immediately
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "public, max-age=0, must-revalidate"

# Images, fonts, audio: cache for 7 days (file names are not versioned)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Third-party libraries (pinned versions): cache for a year
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.m4a"
  [headers.values]
    Content-Type = "audio/mp4"
